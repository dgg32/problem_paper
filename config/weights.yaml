# Tier-A scoring weights (plan.md §2.2).
#
# Edit these to change how candidates are ranked -- no code change needed.
# graph_processing/tier_a_scoring.py loads this file at import time; if it's
# missing or fails to parse, it falls back to the hardcoded DEFAULT_WEIGHTS
# in that file (same values as below) so the pipeline never silently breaks.
#
# This file is under git, so `git log -p config/weights.yaml` is the audit
# trail for who changed a weight and when/why -- put the reason in the
# commit message. build_review_page.py and flag_evidence_report.py both
# import WEIGHTS from tier_a_scoring.py, so a single edit here covers all
# three.
#
# Do NOT add keys here for image-forensics, PubPeer, GDS, raw paperconan
# severity counts, or reference_integrity_flag_count -- those are
# deliberately soft / signal-not-verdict inputs (plan.md §0: every scored
# point must be an explainable, low-false-positive fact). See the full
# rationale for each exclusion in tier_a_scoring.py's module docstring
# before adding a new key.

# sensor flags
retracted_citation_flag_count: 3.0        # citing known-retracted work (graph-internal), very suspicious
external_retracted_citation_flag_count: 2.0  # citing a retracted paper outside our RW-seeded corpus (confirmed live via OpenAlex)
journal_integrity_flag_count: 1.0         # publishing in a compromised/predatory-flagged journal
ai_text_tell_flag_count: 2.0              # obvious AI-generated text
p_value_hacking_flag_count: 0.5           # lowest weight -- noisy given small per-paper p-value samples
pubmed_eoc_flag: 2.5                      # formal, dated, journal-issued Expression of Concern
pubmed_erratum_flag: 0.3                  # weak signal -- most errata are benign corrections
ori_finding_flag: 4.0                     # federal ORI misconduct finding naming this exact DOI -- strongest fact-based signal

# graph features (Neo4j)
coauthor_other_misconduct: 1.5            # per probable-person co-author with a misconduct paper elsewhere
institution_retr_rate: 1.5                # institution's retraction rate in [0,1]; max across a paper's INVOLVES institutions
crossref_correction_flag_count: 0.3       # Crossref-deposited correction notices on this DOI; low weight, often benign

# journal_retr_rate (graph-internal) REMOVED 2026-07-22: it and
# journal_integrity_flag_count's check 3 (>10% retraction-rate threshold,
# see sensors/journal_integrity_check.py) measured the SAME underlying fact
# -- this journal's retraction rate in our own seeded graph -- one
# continuously, one as a threshold, so a paper could be scored twice for one
# real cause. journal_retr_rate_external below is the real, non-redundant
# replacement. The property itself still exists as a Tier-B GDS input
# feature (gds_node_classification.py) -- just no longer scored/shown here.

# EXTERNAL rates (publisher_retraction_rate.py / country_retraction_rate.py /
# journal_retraction_rate_external.py, added 2026-07-22): unlike
# institution_retr_rate above (graph-internal, biased toward our own
# retraction-seeded corpus), these use the FULL Retraction Watch csv as
# numerator and Crossref/OpenAlex totals as an unbiased external denominator
# -- real-world scale, so typical values are ~0.001-0.08, not 0.3-1.0 like
# the graph-internal rates.
#
# RETUNING HISTORY, all 2026-07-22 (same day these were added):
#   1. Original: 1.5/1.0/2.0, same per-tier precedent as the graph-internal
#      rates, "small absolute contribution is fine, relative ordering is what
#      matters" -- in practice too small to move rankings at all.
#   2. Rescaled to publisher/journal x100, country x1000 -- promptly "too
#      much weight": journal_retr_rate_external alone hit +52 for the top
#      journal's ~26% rate, dwarfing every sensor-flag weight incl.
#      ori_finding_flag's 4.0, and some papers reached the top of the
#      ranking on venue alone.
#   3. Walked back to x10/x10/x1000 (publisher 15, journal 20, country
#      1000) -- fixed the dominance but now these signals "barely play a
#      role" for the bulk of papers with a typical (non-outlier) rate.
# ROOT CAUSE (fixed properly here, not by picking yet another weight): these
# three rates are heavy-tailed -- most candidates ~0.01%-1%, a handful of
# Hindawi-family journals 8%-26%. NO single linear weight can both
# differentiate the typical range AND avoid letting the extreme tail
# dominate -- turn it up enough to matter normally and the tail explodes;
# turn it down to tame the tail and it goes invisible for everyone else.
# There's also a conceptual reason a hard ceiling belongs here, not just a
# numeric one: a venue's aggregate rate is evidence about the VENUE, not
# about THIS paper -- same ecological-not-direct category as
# coauthor_other_misconduct (plan.md §0: same person/place ≠ same
# responsibility) -- so it must never be able to outrank direct per-paper
# evidence (an ORI finding, this paper's own AI-text tells) on venue alone,
# no matter how elevated the rate.
# FIX: weight is set high enough to differentiate the normal range; a
# separate _cap key ceilings the resulting contribution (see
# capped_contribution() in tier_a_scoring.py -- contribution = min(rate *
# weight, cap)). The raw rate is still shown in the evidence text; only the
# SCORED contribution is capped. Current caps (2.0 for publisher/journal,
# 1.5 for country) sit below ori_finding_flag/paperconan_confirmed's 4.0 and
# pubmed_eoc_flag's 2.5, so even a maxed-out venue signal stays a real but
# non-dominant nudge -- comparable to, never bigger than, the strongest
# direct-evidence signals above.
publisher_retr_rate: 100                  # publisher's real-world retraction rate; CAPPED, see publisher_retr_rate_cap
publisher_retr_rate_cap: 2.0              # ceiling on publisher_retr_rate's contribution
country_retr_rate: 1000                   # country's real-world retraction rate (smallest typical rate); CAPPED, see country_retr_rate_cap
country_retr_rate_cap: 1.5                # ceiling on country_retr_rate's contribution
journal_retr_rate_external: 100           # journal's real-world retraction rate; CAPPED, see journal_retr_rate_external_cap
journal_retr_rate_external_cap: 2.0       # ceiling on journal_retr_rate_external's contribution

# author_retr_rate_external (added 2026-07-22): a FIRST or LAST author's own
# retraction RATE -- ORCID's claimed-works list as denominator, full
# Retraction Watch csv matched by DOI (not name) as numerator, so it needs no
# name-matching heuristics. Restricted to first/last position ("directly
# responsible for the outcome", the user's framing) -- see
# graph_processing/author_retraction_rate_external.py.
# RETUNING HISTORY, all 2026-07-22 (same day):
#   1. RATE * weight 1.0 (weight = ceiling at a theoretical 100% rate).
#   2. User clarified they wanted COUNT * weight 1.0 instead ("Jingshan Shi
#      has 4 retracted works... that should add 4 points") -- fixed a real
#      undercounting problem (a 37.6%-rate/50-retraction author scored only
#      +0.376 under (1)) but then let an extreme repeat offender (248
#      retracted works) score +248 uncapped, alone dwarfing every other
#      candidate's score (next tier ~15-20).
#   3. Capped the count at 10 -- fixed the dominance, but a raw "10
#      retracted works" ceiling reads oddly next to every other weight here.
#   4. Settled: back to RATE, but * 100 and capped at 10 -- same
#      weight/cap shape as publisher_retr_rate/journal_retr_rate_external,
#      so this signal now reads on the same scale as its siblings. The raw
#      retracted-works count is still shown in the evidence text for context.
author_retr_rate_external: 100.0
author_retr_rate_external_cap: 10.0

# paperconan (filesystem-derived, see load_paperconan_runs() in tier_a_scoring.py)
# Only these two ADJUDICATED verdicts are scored -- never raw high/medium/low counts.
paperconan_needs_human: 2.0               # opened, quantified anomaly that survived adjudication (~ pubmed_eoc)
paperconan_confirmed: 4.0                 # confirmed by adjudication (tied with ori_finding_flag)
