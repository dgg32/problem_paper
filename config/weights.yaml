# Tier-A scoring weights (plan.md §2.2).
#
# Edit these to change how candidates are ranked -- no code change needed.
# graph_processing/tier_a_scoring.py loads this file at import time; if it's
# missing or fails to parse, it falls back to the hardcoded DEFAULT_WEIGHTS
# in that file (same values as below) so the pipeline never silently breaks.
#
# This file is under git, so `git log -p config/weights.yaml` is the audit
# trail for who changed a weight and when/why -- put the reason in the
# commit message. build_review_page.py and flag_evidence_report.py both
# import WEIGHTS from tier_a_scoring.py, so a single edit here covers all
# three.
#
# Do NOT add keys here for image-forensics, PubPeer, GDS, raw paperconan
# severity counts, or reference_integrity_flag_count -- those are
# deliberately soft / signal-not-verdict inputs (plan.md §0: every scored
# point must be an explainable, low-false-positive fact). See the full
# rationale for each exclusion in tier_a_scoring.py's module docstring
# before adding a new key.

# sensor flags
retracted_citation_flag_count: 3.0        # citing known-retracted work (graph-internal), very suspicious
external_retracted_citation_flag_count: 2.0  # citing a retracted paper outside our RW-seeded corpus (confirmed live via OpenAlex)
journal_integrity_flag_count: 1.0         # publishing in a compromised/predatory-flagged journal
ai_text_tell_flag_count: 2.0              # obvious AI-generated text
tortured_phrase_flag_count: 2.5           # added 2026-08-17: exact multi-word match against Cabanac's PPS
                                           # "Favourite Tortured Phrases" list; near-zero false positive per
                                           # sensors/tortured_phrases_detector.py's own docstring, slightly higher
                                           # than ai_text_tell_flag_count's 2.0 since a garbled scientific term is
                                           # a more specific tell than a generic "as an AI language model" phrase.
                                           # Was previously only in tier_a_scoring.py's hardcoded DEFAULT_WEIGHTS,
                                           # not here -- backfilled 2026-09-03 so this weight is actually the
                                           # git-tracked, user-editable one the module docstring promises.
p_value_hacking_flag_count: 0.5           # lowest weight -- noisy given small per-paper p-value samples
pubmed_eoc_flag: 10.0                     # formal, dated, journal-issued Expression of Concern (raised from 2.5, 2026-07-22, user request)
pubmed_erratum_flag: 0.3                  # weak signal -- most errata are benign corrections
ori_finding_flag: 4.0                     # federal ORI misconduct finding naming this exact DOI -- strongest fact-based signal

# graph features (Neo4j)
crossref_correction_flag_count: 0.3       # Crossref-deposited correction notices on this DOI; low weight, often benign

# coauthor_other_misconduct (flat 1.5/co-author, uncapped) REMOVED 2026-07-22,
# user request: merged with author_retr_rate_external into one unified
# "co-author has other retracted work" model, split by AUTHOR POSITION
# (first/last vs middle) and by SEVERITY (misconduct-reason vs any other
# reason) instead of by matching discipline. User's framing: 1st/last authors
# score 2x a middle co-author; a misconduct-reason retraction scores 2x an
# any-reason one. That gives four buckets in a 1:2:2:4 ratio (mid_any :
# mid_misconduct == fl_any : fl_misconduct == 1:2), computed by
# author_retraction_rate_external.py (first/last, ORCID-strict, external
# Retraction Watch) and coauthor_retraction_severity.py (middle, fuzzy
# probable-person cluster, graph-internal) respectively.
# MINMAX, not flat/uncapped, same reasoning as the five entity-rate signals
# below: literal "+2/+4 points per retracted work" would have let one
# extremely prolific author (one first/last author in this corpus has 248
# ORCID-claimed works flagged retracted) dominate every paper they appear on
# by 40-80x anything else in the system. Minmax-scaling the per-paper COUNT
# of qualifying positions/co-authors (not the underlying person's own total
# retraction tally) sidesteps that: for fl_any/fl_misconduct the count is
# naturally 0-2 (only two slots per paper) so minmax barely differs from a
# flat per-position score; for mid_any/mid_misconduct the count can run
# higher (a paper's own author-list size), so minmax's usual "worst-in-corpus
# anchors the target, everyone else proportionally less" protection matters
# there. Checked live before shipping: current corpus maxima are mid_any=?,
# mid_misconduct=?, fl_any=2, fl_misconduct=2 (see coauthor_retraction_
# severity.py's / author_retraction_rate_external.py's own verification
# printout for current numbers -- re-check whenever these are re-run).
mid_any_minmax_target: 2.5          # middle co-author, ANY-reason retraction elsewhere (graph-internal, fuzzy cluster)
mid_misconduct_minmax_target: 5.0   # middle co-author, MISCONDUCT-reason retraction elsewhere (2x mid_any)
fl_any_minmax_target: 5.0           # 1st/last author, ANY-reason retraction elsewhere (external, ORCID-strict; 2x mid_any)
fl_misconduct_minmax_target: 10.0   # 1st/last author, MISCONDUCT-reason retraction elsewhere (4x mid_any, 2x fl_any)

# VOLUME (added 2026-08-16, user request): the four PRESENCE targets above
# deliberately answer only "does this author/cluster have ANY qualifying
# retraction" -- 1 retraction and 17 score identically by design (that's the
# 2026-07-22 fix for the 248-work-author domination problem noted above).
# Verified live 2026-08-16 that this erases a real signal: a paper's last
# author with 17 other retracted works (10.1016/j.envres.2024.119440,
# subsequently retracted itself) scored no differently than 1 would have.
# These four targets score the SAME underlying retraction COUNT a second
# time, minmax-scaled against ITS OWN corpus-worst value (fl_any_volume/
# fl_misconduct_volume/mid_any_volume/mid_misconduct_volume) -- additive to,
# not a replacement for, the presence targets above. Minmax is what makes
# this safe to reintroduce without reopening the domination bug: the corpus's
# single worst author/cluster scores a fixed target no matter how far ahead
# of everyone else they are (checked live: Pierre-Edouard Fournier,
# fl_any_volume=134, qualifies on 17 of this corpus's candidate papers;
# worst middle-cluster mid_any_volume=347). Deliberately HALF the matching
# presence target (user-chosen scale) so presence ("tainted at all?") stays
# the dominant signal and volume ("how much?") is a meaningful but secondary
# amplifier, not a co-equal one.
mid_any_volume_minmax_target: 1.25         # half of mid_any_minmax_target
mid_misconduct_volume_minmax_target: 2.5   # half of mid_misconduct_minmax_target
fl_any_volume_minmax_target: 2.5           # half of fl_any_minmax_target
fl_misconduct_volume_minmax_target: 5.0    # half of fl_misconduct_minmax_target

# journal_retr_rate (graph-internal) REMOVED 2026-07-22: it and
# journal_integrity_flag_count's check 3 (>10% retraction-rate threshold,
# see sensors/journal_integrity_check.py) measured the SAME underlying fact
# -- this journal's retraction rate in our own seeded graph -- one
# continuously, one as a threshold, so a paper could be scored twice for one
# real cause. journal_retr_rate_external below is the real, non-redundant
# replacement. The property itself still exists as a Tier-B GDS input
# feature (gds_node_classification.py) -- just no longer scored/shown here.

# ENTITY-LEVEL RETRACTION RATES (institution_retraction_rate.py /
# publisher_retraction_rate.py / country_retraction_rate.py /
# journal_retraction_rate_external.py). author_retraction_rate_external.py
# USED to be a fifth rate-based member of this family; as of 2026-07-22 its
# scored output was replaced by the count-based fl_any/fl_misconduct minmax
# targets above (merged with coauthor_other_misconduct) -- see that section's
# comment. institution_retr_rate is graph-internal (biased toward our own
# retraction-seeded corpus, so typical values run 0.3-1.0); the other three
# use the FULL Retraction Watch csv as numerator against a Crossref/OpenAlex
# external denominator -- real-world scale, typical values ~0.001-0.08.
#
# WEIGHTING HISTORY, all 2026-07-22 (same day these were added):
#   1. Original: plain linear weights (1.5/1.0/2.0-ish), "small absolute
#      contribution is fine, relative ordering is what matters" -- too small
#      to move rankings at all in practice.
#   2. Rescaled x100/x1000 -- promptly "too much weight": one signal alone
#      hit +52 for the top journal's ~26% rate, dwarfing every sensor-flag
#      weight incl. ori_finding_flag's 4.0, some papers reaching #1 on venue
#      alone.
#   3. Walked back to smaller multipliers -- fixed the dominance but now
#      these signals "barely play a role" for the bulk of typical-rate papers.
#   4. Fixed properly: contribution = min(rate * weight, cap) -- a per-signal
#      hard ceiling. Worked, but still had an arbitrary-feeling number
#      (why 2.0? why 10.0?) disconnected from the actual data.
#   5. REPLACED WITH MINMAX SCORING (this update): instead of a weight and a
#      fixed cap, each signal is scaled against its own observed worst-in-
#      corpus value -- see minmax_contribution()/compute_corpus_maxes() in
#      tier_a_scoring.py. The single worst offender in a category (e.g. the
#      author with the highest personal retraction rate found in this run)
#      scores exactly the "_minmax_target" value below (20 by default);
#      every other entity in that same category scores proportionally less
#      (a rate half as bad scores half as much). institution_retr_rate is
#      folded into this same mechanism too (previously a bare linear weight,
#      uncapped) -- it's the same kind of entity-level rate, just measured
#      against our own graph instead of an external denominator.
# ROOT CAUSE this fixes (same as the capping episode): these rates are
# heavy-tailed -- most candidates ~0.01%-1% (or 0.3-1.0 for
# institution_retr_rate's graph-internal scale), a handful of entities far
# higher. No single linear weight can differentiate the typical range AND
# stop the extreme tail from dominating. Minmax sidesteps this by construction
# -- the tail always maps to exactly the target, never higher, and everyone
# else is honestly proportional to it. TRADEOFF worth knowing: minmax is MORE
# sensitive to a single new extreme outlier than a fixed cap was, since that
# outlier becomes the anchor for every other entity's score in its category,
# not just its own -- checked live before shipping that all four current
# maxima are backed by reasonably large samples (see tier_a_scoring.py's
# module docstring for the exact numbers), not a fragile single-paper
# artifact, but re-check this if a future run's max looks like it might be
# based on a tiny/noisy sample.
# There's also a conceptual reason these four are treated specially, separate
# from the heavy-tail/numeric problem: an institution/publisher/country/
# journal's aggregate rate is evidence about the ENTITY, not about
# THIS paper -- same ecological-not-direct category as the fl_*/mid_*
# co-author signals above (plan.md §0: same person/place ≠ same
# responsibility) -- so it must never be able to outrank direct per-paper
# evidence (an ORI finding, this paper's own AI-text tells) on entity
# association alone. The raw rate is still shown in the evidence text; only
# the SCORED contribution is minmax-scaled. Targets LOWERED to 10 (from an
# initial 20) 2026-07-22, same day, user request -- the original 20 was well
# above every direct-evidence signal in the system, in tension with the
# "should never outrank direct per-paper evidence" principle above; 10 is
# still above ori_finding_flag/paperconan_confirmed's 4.0 (the single
# worst-in-corpus offender in any of these 5 categories can still outscore an
# ORI finding alone), but ties pubmed_eoc_flag's new 10.0 (also raised the
# same day) rather than dwarfing it outright. Lower further if even this is
# too high relative to direct-evidence signals.
institution_retr_rate_minmax_target: 10.0
publisher_retr_rate_minmax_target: 10.0
# country_retr_rate LOWERED to 2.5 (from 10.0) 2026-07-22, same day, user
# request: country is by far the coarsest of these 5 categories, so its
# worst-in-corpus value (Saudi Arabia, 0.33% national rate) is shared by ~60+
# candidate papers, all getting the FULL target regardless of their own
# evidence -- unlike institution/publisher/journal/author, where the max is
# typically held by only 1-4 papers. Checked: this isn't a small-sample
# artifact (SA's rate rests on 2,418 RW records / 734k OpenAlex works, CN's on
# 37,620 / 16.7M -- both large, low-variance estimates; Bayesian shrinkage
# toward the global mean was tried and does NOT change the ranking unless the
# prior is implausibly strong, since neither country's rate is actually
# noisy). The real issue is structural, not statistical: minmax's winner-
# take-all scaling combined with country's coarse granularity. Lowering the
# target (rather than shrinking the rate) directly caps how much a single
# ecological, paper-non-specific bucket can contribute.
country_retr_rate_minmax_target: 2.5
journal_retr_rate_external_minmax_target: 10.0

# paperconan (filesystem-derived, see load_paperconan_runs() in tier_a_scoring.py)
# Only these two ADJUDICATED verdicts are scored -- never raw high/medium/low counts.
paperconan_needs_human: 2.0               # opened, quantified anomaly that survived adjudication
paperconan_confirmed: 4.0                 # confirmed by adjudication (tied with ori_finding_flag)
